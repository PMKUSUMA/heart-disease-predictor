version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-heart-disease-predictor-secret-change-in-prod}
      - FLASK_ENV=${FLASK_ENV:-production}
    volumes:
      - db_data:/app/instance
    restart: unless-stopped

volumes:
  db_data:
